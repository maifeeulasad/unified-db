name: Run Tests with Coverage and Reports

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start services with Docker Compose
        run: docker-compose -f test/docker-compose.yaml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to become healthy..."
          docker-compose -f test/docker-compose.yaml ps
          sleep 15

      - name: Install global dependencies
        run: npm i -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run test:coverage
        run: pnpm run test:coverage

      - name: Run test:report
        run: pnpm run test:report

      - name: Run test:report:coverage
        run: pnpm run test:report:coverage

      - name: Stop services
        run: docker-compose -f test/docker-compose.yaml down
