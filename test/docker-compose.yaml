version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: local-unified-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: local-unified-db
      MONGO_INITDB_ROOT_USERNAME: mongodbusername
      MONGO_INITDB_ROOT_PASSWORD: mongodbpassword
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: